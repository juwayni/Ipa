name: Build PWA Web App and Mobile APK

on:
  push:
    branches: [ main, master, "jules/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-pwa:
    name: Build PWA Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check and build web distribution
        run: |
          npx tsc --noEmit
          npm run build

      - name: Upload PWA Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-web-dist
          path: dist/

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-pwa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "IPA Master" "com.ipamaster.app" --web-dir dist
          npx cap add android || true
          npx cap copy android

      - name: Build Android Debug APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
